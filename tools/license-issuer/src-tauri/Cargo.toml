[package]
name = "webfit-license-issuer"
version = "0.1.1"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }

[dependencies]
tauri = { version = "=2.12.1", features = [] }
tauri-plugin-dialog = "=2.8.1"
webfit-license-protocol = { path = "../../../crates/license-protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.2", features = ["bundled-sqlcipher-vendored-openssl", "backup"] }
uuid = { version = "1.26.1", features = ["v4"] }
argon2 = "0.5.3"
aes-gcm = "0.10.3"
base64 = "0.22.1"
zeroize = "1.8.2"
windows-sys = { version = "0.61.2", features = ["Win32_Security_Cryptography", "Win32_Foundation", "Win32_System_RemoteDesktop"] }

[dev-dependencies]
tempfile = "3.27"
