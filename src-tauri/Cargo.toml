[package]
name = "webfit-desktop"
version = "0.1.8"
description = "WebFit Desktop — primeiro incremento local"
edition = "2021"
license = "LicenseRef-WebFit"

[lib]
name = "webfit_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }

[dependencies]
tauri = { version = "=2.12.1", features = [] }
tauri-plugin-dialog = "=2.8.1"
tauri-plugin-updater = "=2.12.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.2", features = ["bundled-sqlcipher-vendored-openssl", "backup"] }
chrono = { version = "0.4.45", features = ["serde"] }
uuid = { version = "1.26.1", features = ["v4"] }
argon2 = "0.5.3"
aes-gcm = "0.10.3"
base64 = "0.22.1"
sha2 = "0.10.9"
unicode-normalization = "0.1.25"
zeroize = { version = "1.8.2", features = ["derive"] }
windows-sys = { version = "0.61.2", features = ["Win32_Security_Cryptography", "Win32_Foundation", "Win32_System_Memory", "Win32_System_RemoteDesktop"] }

[dev-dependencies]
tempfile = "3.27"

[profile.release]
strip = true
panic = "abort"
lto = "thin"
