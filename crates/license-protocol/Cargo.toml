[package]
name = "webfit-license-protocol"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22.1"
sha2 = "0.10.9"
uuid = { version = "1.26.1", features = ["v4", "serde"] }
argon2 = "0.5.3"
zeroize = "1.8.2"
ed25519-dalek = { version = "=2.2.0", features = ["rand_core"] }
crypto_box = { version = "=0.9.1", features = ["seal"] }
