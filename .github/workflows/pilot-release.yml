name: Publish WebFit pilot

on:
  workflow_dispatch:

jobs:
  publish-pilot:
    # DEC-044: publication deferred; preserve preparation without executing it.
    if: ${{ false }}
    concurrency:
      group: webfit-pilot-publication
      cancel-in-progress: false
    runs-on: [self-hosted, windows, x64]
    permissions:
      contents: read
    env:
      WEBFIT_RELEASE_REPO: ${{ vars.WEBFIT_RELEASE_REPO }}

    steps:
      - name: Validate release configuration
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WEBFIT_RELEASE_REPO)) {
            throw "Repository variable WEBFIT_RELEASE_REPO is required."
          }
          if ($env:WEBFIT_RELEASE_REPO -eq "WebFit-DESKTOP") {
            throw "Pilot artifacts must use a separate release-only repository."
          }

      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install frontend dependencies
        working-directory: spikes/g4-tauri-foundation
        run: npm ci

      - name: Verify release verifier
        run: node --test scripts/pilot-release.test.mjs

      - name: Check TypeScript and frontend build
        working-directory: spikes/g4-tauri-foundation
        run: npm run build

      - name: Check Rust formatting
        working-directory: spikes/g4-tauri-foundation/src-tauri
        run: cargo fmt --all -- --check

      - name: Check Rust lint
        working-directory: spikes/g4-tauri-foundation/src-tauri
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test Rust and SQLite
        working-directory: spikes/g4-tauri-foundation/src-tauri
        run: cargo test --locked

      - name: Test SQLCipher encryption
        working-directory: spikes/g4-tauri-foundation/src-tauri
        run: cargo test --locked --no-default-features --features sqlcipher-spike sqlcipher_encrypts_database_and_rejects_wrong_key

      - name: Test SQLCipher portable backup
        working-directory: spikes/g4-tauri-foundation/src-tauri
        run: cargo test --locked --no-default-features --features sqlcipher-spike portable_backup

      - name: Set pilot version
        shell: pwsh
        working-directory: spikes/g4-tauri-foundation
        env:
          WEBFIT_PILOT_VERSION: 0.1.0-pilot.${{ github.run_number }}.${{ github.run_attempt }}
        run: |
          npm version --no-git-tag-version $env:WEBFIT_PILOT_VERSION
          $cargo = Get-Content -Raw src-tauri/Cargo.toml
          $cargo = [regex]::Replace($cargo, '(?m)^version = ".*"$', 'version = "' + $env:WEBFIT_PILOT_VERSION + '"', 1)
          [IO.File]::WriteAllText((Resolve-Path src-tauri/Cargo.toml), $cargo, (New-Object Text.UTF8Encoding($false)))
          $tauri = Get-Content -Raw src-tauri/tauri.conf.json
          $tauri = [regex]::Replace($tauri, '"version": ".*"', '"version": "' + $env:WEBFIT_PILOT_VERSION + '"', 1)
          [IO.File]::WriteAllText((Resolve-Path src-tauri/tauri.conf.json), $tauri, (New-Object Text.UTF8Encoding($false)))

      - name: Publish signed pilot release
        id: pilot
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.WEBFIT_RELEASE_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: spikes/g4-tauri-foundation
          owner: Maycon-bd
          repo: ${{ vars.WEBFIT_RELEASE_REPO }}
          releaseCommitish: main
          tagName: pilot-v__VERSION__
          releaseName: WebFit pilot v__VERSION__
          releaseBody: Generated from reviewed main merge. Pilot channel only.
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          uploadUpdaterSignatures: true
          tauriScript: npm run tauri --

      - name: Verify public release and publish checksums
        env:
          GITHUB_TOKEN: ${{ secrets.WEBFIT_RELEASE_TOKEN }}
          RELEASE_ID: ${{ steps.pilot.outputs.releaseId }}
          RELEASE_VERSION: ${{ steps.pilot.outputs.appVersion }}
        run: node scripts/pilot-release.mjs
