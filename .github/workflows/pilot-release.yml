name: Publish WebFit pilot

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: webfit-pilot-publication
  cancel-in-progress: false

jobs:
  publish-pilot:
    # DEC-053: activation prepared locally; user performs Git integration.
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: [self-hosted, windows, x64]
    defaults:
      run:
        shell: cmd
    permissions:
      contents: read
    env:
      WEBFIT_RELEASE_REPO: ${{ vars.WEBFIT_RELEASE_REPO }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
      - name: Test compiler preparation
        run: node --test scripts/runner-env.test.mjs
      - name: Prepare compiler environment
        run: node scripts/runner-env.mjs --initialize
      - name: Validate release repository
        run: node -e "if (process.env.WEBFIT_RELEASE_REPO !== 'webfit-desktop-releases') throw new Error('Unexpected release repository.')"
      - name: Install locked frontend dependencies
        run: npm ci
      - name: Test release tooling
        run: node --test scripts/pilot-release.test.mjs scripts/prepare-pilot.test.mjs scripts/stage-pilot.test.mjs
      - name: Verify frontend format
        run: npm run format:check
      - name: Verify product frontend
        run: npm run check
      - name: Verify Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - name: Verify Rust lint
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Test product and SQLite recovery
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Prepare unique pilot version
        id: version
        run: node scripts/prepare-pilot.mjs
      - name: Build signed updater installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri -- build --bundles nsis -- --locked
      - name: Verify local signature and stage assets
        run: node scripts/stage-pilot.mjs
      - name: Publish staged pilot
        id: pilot
        env:
          WEBFIT_RELEASE_TOKEN: ${{ secrets.WEBFIT_RELEASE_TOKEN }}
        run: node scripts/publish-pilot.mjs
      - name: Verify public publication
        env:
          GITHUB_TOKEN: ${{ secrets.WEBFIT_RELEASE_TOKEN }}
          RELEASE_ID: ${{ steps.pilot.outputs.releaseId }}
          RELEASE_VERSION: ${{ steps.pilot.outputs.version }}
        run: node scripts/pilot-release.mjs
